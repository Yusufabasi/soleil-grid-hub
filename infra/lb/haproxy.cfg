# Soleil Grid Hub local balancer: five pools, one per deployable family (docs/09 1.4).
#
# This file is the local copy of the edge configuration. Production terminates TLS here
# instead of binding :8080 in clear text; everything else (pool split, health checks, log
# hygiene, security headers) is the same so what works locally works there.
#
# Two rules are load-bearing and must not be relaxed:
#   * `use_backend` is evaluated in order, so the ingest and stream pools are decided before
#     the `/api/` catch-all; otherwise webhooks would land on be_api.
#   * The log format carries the path (%HP) and never the query string: a dashboard stream
#     ticket is single use and lives in the query string (D-18), so %r, %HU and %HQ must not
#     appear here; the CI security job greps this file and fails on them.

global
  log stdout format raw local0
  maxconn 20000
  # The image runs as uid 99 and /var/run is a root-owned symlink, so the admin socket lives in
  # the directory that image gives to that user; compose mounts a volume there so it survives a
  # restart. Drain a replica with:
  #   echo "set server be_api/api1 state drain" | socat stdio /var/lib/haproxy/haproxy.sock
  stats socket /var/lib/haproxy/haproxy.sock mode 660 level admin expose-fd listeners

resolvers docker
  nameserver dns 127.0.0.11:53
  accepted_payload_size 8192
  hold valid 5s

defaults
  mode http
  log global
  option httplog
  option forwardfor
  option redispatch
  retries 2
  timeout connect 3s
  timeout client 30s
  timeout server 30s
  timeout http-request 10s
  timeout http-keep-alive 15s
  default-server init-addr libc,none resolvers docker

frontend fe_main
  bind :8080
  # The balancer owns the request id when the client sent none, and echoes it back so a
  # support ticket can be tied to one request (docs/03 7.3).
  http-request set-header X-Request-ID %[uuid()] unless { req.hdr(X-Request-ID) -m found }
  http-request set-header traceparent 00-%[uuid(),regsub(-,,g)]-0000000000000001-01 unless { req.hdr(traceparent) -m found }
  http-request set-var(txn.reqid) req.hdr(X-Request-ID)
  http-response set-header X-Request-ID %[var(txn.reqid)]
  log-format "%ci:%cp [%tr] %ft %b/%s %TR/%Tw/%Tc/%Tr/%Ta %ST %B %[var(txn.reqid)] %HM %HPO"
  acl is_webhooks  path_beg /api/v1/webhooks/providers/
  acl is_telemetry path_beg /api/v1/telemetry/ /api/v1/gateway/
  acl is_sse       path /api/v1/dashboard/stream
  acl is_api       path_beg /api/
  acl is_static    path_beg /_next/static/
  # A response rule cannot evaluate the request path, so the routing decision is recorded
  # while the request header block is still available and reused by the http-response rules.
  http-request set-var(txn.pool) str(webhooks)  if is_webhooks
  http-request set-var(txn.pool) str(telemetry) if is_telemetry
  http-request set-var(txn.pool) str(stream)    if is_sse
  http-request set-var(txn.pool) str(api)       if is_api
  http-request set-var(txn.pool) str(web)       unless { var(txn.pool) -m found }
  http-request set-var(txn.static) bool(true)   if is_static
  # Edge security headers on every response; the HTML CSP with nonces is hub-web's job.
  http-response set-header Strict-Transport-Security "max-age=15552000; includeSubDomains"
  http-response set-header X-Content-Type-Options nosniff
  http-response set-header Referrer-Policy strict-origin-when-cross-origin
  http-response set-header Permissions-Policy "camera=(), microphone=(), geolocation=()"
  http-response set-header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" if { var(txn.pool) -m str api }
  http-response del-header X-Powered-By
  http-response del-header Server
  # Caching: hashed assets for a year; any page response without an explicit policy is never
  # cached, and API responses are never cached by the edge.
  http-response set-header Cache-Control "public, max-age=31536000, immutable" if { var(txn.static) -m bool } { status 200 }
  http-response set-header Cache-Control "no-store" if !{ var(txn.pool) -m str api } !{ var(txn.static) -m bool } !{ res.hdr(Cache-Control) -m found }
  use_backend be_webhooks  if is_webhooks
  use_backend be_telemetry if is_telemetry
  use_backend be_stream    if is_sse
  use_backend be_api       if is_api
  default_backend be_web

backend be_web
  balance roundrobin
  option httpchk
  http-check send meth GET uri /web/health hdr Host hub
  http-check expect status 200
  default-server check inter 2s fall 2 rise 3 slowstart 10s maxconn 300
  server-template web 2 hub-web:3000

backend be_api
  balance leastconn
  option httpchk
  http-check send meth GET uri /api/v1/health/ready hdr Host hub
  http-check expect status 200
  default-server check inter 2s fall 2 rise 3 slowstart 20s maxconn 200
  server-template api 2 hub-api:8000

backend be_stream
  balance leastconn
  option httpchk
  http-check send meth GET uri /api/v1/health/ready hdr Host hub
  http-check expect status 200
  # Three missed 20 s heartbeats before the stream is considered dead.
  timeout server 75s
  timeout tunnel 1h
  no option http-buffer-request
  http-response set-header X-Accel-Buffering no
  http-response set-header Cache-Control no-cache
  default-server check inter 2s fall 2 rise 3 slowstart 20s maxconn 1000
  server-template stream 2 hub-stream:8000

backend be_webhooks
  balance roundrobin
  option httpchk
  http-check send meth GET uri /api/v1/health/ready hdr Host hub
  http-check expect status 200
  # Safe L7 retry of POST: (provider, event_id) uniqueness makes a replay a no-op (FR-03).
  # HAProxy only retries a non-idempotent method when it still holds the request, which is what
  # buffering the request body buys; there is no per-rule permission directive.
  option http-buffer-request
  retry-on conn-failure empty-response 503
  default-server check inter 2s fall 2 rise 3 slowstart 10s maxconn 400
  server-template webhooks 2 hub-ingest-webhooks:8000

backend be_telemetry
  balance roundrobin
  option httpchk
  http-check send meth GET uri /api/v1/health/ready hdr Host hub
  http-check expect status 200
  # Safe L7 retry of POST: reading_batches makes a replayed batch a no-op (D-25).
  option http-buffer-request
  retry-on conn-failure empty-response 503
  default-server check inter 2s fall 2 rise 3 slowstart 10s maxconn 600
  server-template telemetry 2 hub-ingest-telemetry:8000

frontend fe_stats
  bind :8404
  http-request return status 200 content-type text/plain string ok if { path /healthz }
  http-request use-service prometheus-exporter if { path /metrics }
  stats enable
  stats uri /stats
