; Soleil Grid Hub local connection pooler (docs/04 10.10).
;
; Transaction pooling is the mode the application is written for: Django keeps CONN_MAX_AGE
; at 0, server-side cursors are disabled and psycopg's prepared statements are switched off
; at connection time, so a client never depends on the server connection it got last time.
; Prepared statements stay disabled here too (no max_prepared_statements), which is the
; other half of that decision (A-13): enabling one side without the other breaks at runtime.
;
; One pool per role. The [databases] entries name the pool a deployable connects to, and the
; role in the connection string selects which credentials it authenticates with:
;   hub_rw        hub_api (primary alias), hub_ingest, hub_worker, ai_gateway
;   hub_ro        hub_api (replica alias), hub_stream
;   hub_analytics the three analytics logins; db/schema.sql already sets their
;                 default_transaction_read_only and a 5 s statement_timeout per role, which is
;                 the right place for it: the guard rail then holds for every connection,
;                 not only the ones that arrive through this pooler
; Locally there is no read replica, so hub_ro points at the primary; the mapping is the only
; thing that changes when the replica service lands (docs/09 1.3, plan note 12).

[databases]
hub_rw        = host=pg-primary port=5432 dbname=hub
hub_ro        = host=pg-primary port=5432 dbname=hub
hub_analytics = host=pg-primary port=5432 dbname=hub

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

; SCRAM end to end. userlist.txt carries the dev passwords in clear text on purpose: a client
; only authenticates with SCRAM if the pooler can compute it, and PostgreSQL 16 stores
; SCRAM-SHA-256 passwords by default, so an MD5 userlist could not log in to the server.
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

pool_mode = transaction
max_client_conn = 1000
default_pool_size = 20
min_pool_size = 0
reserve_pool_size = 5
reserve_pool_timeout = 3

; Transaction mode: the reset query must be empty or it would break the transaction boundary.
server_reset_query =
server_reset_query_always = 0

; The client library sends these on startup; they are not pooler state, so pass them through
; instead of refusing the connection (docs/04 10.10).
ignore_startup_parameters = extra_float_digits,options

server_check_query = select 1
server_check_delay = 30
server_idle_timeout = 600
query_wait_timeout = 10

log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
