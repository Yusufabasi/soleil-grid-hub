# Soleil Grid Hub local stack (docs/09 1.3, adjusted to docs/03 and docs/04 where they differ).
#
# One Python image, several process types (docs/03 1.1): the api pool, the two ingest pools, the
# stream pool and the three worker commands all run soleil/hub:dev with a different command and
# their own database role. The balancer in front of them has exactly five backends, so a request
# takes the same path locally that it takes in production.
#
# Deliberate differences from the docs/09 sketch, all recorded in docs/plan/progress.md:
#   * no pg-replica: hub_ro and the stream alias point at the primary (plan note 12);
#   * no Tempo, Loki, Grafana or Prometheus server: the collector uses the debug exporter and
#     prometheus.yml is the scrape contract the observability slice mounts (plan note 10);
#   * `migrate` runs as the superuser on this throwaway cluster, because the baseline creates
#     the roles and grants; a real environment points HUB_MIGRATE_URL at `migrator` after that
#     one step (docs/04 10.5);
#   * hub-web is an nginx stub until fe-00 (`make up WEB=real` swaps in the Next.js image).
#
#   make up            build, migrate, logins, then the five pools and their dependencies
#   make up WEB=real   the same stack with frontend/ instead of the stub
#   make down          stop it; `make reset` also deletes the volumes

name: soleil

# The readiness probe every HTTP pool answers (docs/09 1.4): 503 while draining, so the
# balancer takes the replica out before the process stops.
x-py-ready: &py-ready
  test:
    - CMD
    - python
    - -c
    - >-
      import urllib.request as u;
      u.urlopen("http://127.0.0.1:8000/api/v1/health/ready", timeout=2)
  interval: 5s
  timeout: 3s
  retries: 3
  # A cold start imports Django in eight containers at once; without this grace a slow first
  # import counts as a failed check and `up --wait` gives up on a container that is coming up.
  start_period: 45s

# The worker commands serve no HTTP, so their liveness signal is the metrics port they open.
x-worker-ready: &worker-ready
  test:
    - CMD
    - python
    - -c
    - >-
      import urllib.request as u;
      u.urlopen("http://127.0.0.1:9102/metrics", timeout=2)
  interval: 10s
  timeout: 3s
  retries: 3
  start_period: 45s

x-app: &app
  image: soleil/hub:${TAG:-dev}
  build:
    context: ../..
    dockerfile: backend/Dockerfile
  environment: &app-env
    HUB_ENV: local
    HUB_VERSION: ${TAG:-dev}
    HUB_SECRET_KEY: ${HUB_SECRET_KEY:?set HUB_SECRET_KEY in .env (make env)}
    HUB_ALLOWED_HOSTS: ${HUB_ALLOWED_HOSTS:?set HUB_ALLOWED_HOSTS in .env (make env)}
    SITE_ORIGIN: ${SITE_ORIGIN:-http://localhost:8080}
    HUB_REDIS_URL: redis://redis:6379/0
    HUB_S3_ENDPOINT: http://minio:9000
    HUB_TRUST_LB_REQUEST_ID: "true"
    HUB_DRAIN_FILE: /tmp/draining
    HUB_METRICS_PORT: "9102"
    # One metrics port per container, one file per worker in this directory: whichever process
    # wins the bind serves the whole pool's series (docs/09 section 5). /tmp is the tmpfs
    # mount, so the files never outlive the container.
    PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
    HUB_REPO_ROOT: /app
    HUB_PROBLEM_BASE_URL: ${HUB_PROBLEM_BASE_URL:-https://hub.soleilgrid.example/problems/}
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    OTEL_RESOURCE_ATTRIBUTES: deployment.environment=local
    # Payments: the local stack collects from the `provider-stub` service (slice T1) instead of
    # from an in-memory double, so a delivery crosses four worker processes, the balancer and the
    # real signature check. Both variables are JSON objects, assembled here from the *same*
    # `STUB_SECRET_*` values the double reads: one source of truth, and no secret literal in this
    # repository. A deployed environment sets both from its secret store and drops the stub.
    HUB_PROVIDER_BASE_URLS: >-
      {"mpesa_cd": "http://provider-stub:9100", "airtel_cd": "http://provider-stub:9100",
       "orange_cd": "http://provider-stub:9100", "synthetic": "http://provider-stub:9100"}
    HUB_PROVIDER_WEBHOOK_SECRETS: >-
      {"mpesa_cd": ["${STUB_SECRET_MPESA_CD:?set STUB_SECRET_MPESA_CD in .env (make env)}"],
       "airtel_cd": ["${STUB_SECRET_AIRTEL_CD:?set STUB_SECRET_AIRTEL_CD in .env (make env)}"],
       "orange_cd": ["${STUB_SECRET_ORANGE_CD:?set STUB_SECRET_ORANGE_CD in .env (make env)}"],
       "synthetic": ["${STUB_SECRET_SYNTHETIC:?set STUB_SECRET_SYNTHETIC in .env (make env)}"]}
  depends_on:
    db-logins:
      condition: service_completed_successfully
    pgbouncer:
      condition: service_started
    redis:
      condition: service_healthy
  stop_grace_period: 40s
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  # --- edge ---------------------------------------------------------------------------------
  lb:
    image: haproxy:3.0-alpine
    ports:
      - "8080:8080"
      - "8404:8404"
    volumes:
      - ../lb/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      # Admin socket and pid file. A fresh named volume inherits this directory's ownership
      # from the image (uid 99), which /var/run does not: it is a root-owned symlink.
      - haproxy-run:/var/lib/haproxy
    depends_on:
      - hub-api
      - hub-ingest-webhooks
      - hub-ingest-telemetry
      - hub-stream
      - hub-web
    healthcheck:
      # 127.0.0.1, not localhost: the image resolves localhost to ::1 first and the stats
      # frontend binds IPv4 only.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8404/healthz"]
      interval: 5s
      timeout: 3s
      retries: 3

  # --- python deployables -------------------------------------------------------------------
  hub-api:
    <<: *app
    command:
      - /app/deploy/entrypoint-drain.sh
      - gunicorn
      - hub.wsgi_api:application
      - -c
      - deploy/gunicorn.py
    environment:
      <<: *app-env
      DJANGO_SETTINGS_MODULE: hub.settings.api
      # Both aliases go through PgBouncer: hub_ro maps to the primary locally (plan note 12).
      HUB_DB_API_URL: postgresql+psycopg://hub_api:${PG_API_PW:-dev}@pgbouncer:6432/hub_rw
      HUB_DB_API_REPLICA_URL: postgresql+psycopg://hub_api:${PG_API_PW:-dev}@pgbouncer:6432/hub_ro
      GUNICORN_WORKERS: "4"
      GUNICORN_THREADS: "4"
      GUNICORN_WORKER_CLASS: gthread
    healthcheck: *py-ready

  # One image, two deployments: webhooks and telemetry scale differently (D-04, D-09).
  # make up SCALE_WEBHOOKS=2 rehearses a canary without touching the other pool.
  hub-ingest-webhooks:
    <<: *app
    command:
      - /app/deploy/entrypoint-drain.sh
      - gunicorn
      - hub.wsgi_ingest:application
      - -c
      - deploy/gunicorn.py
    environment:
      <<: *app-env
      DJANGO_SETTINGS_MODULE: hub.settings.ingest
      HUB_INGEST_ROLE: webhooks
      HUB_DB_INGEST_URL: postgresql+psycopg://hub_ingest:${PG_INGEST_PW:-dev}@pgbouncer:6432/hub_rw
      # Sync workers x 1 thread: bounded concurrency for the one-transaction webhook path.
      GUNICORN_WORKERS: "5"
      GUNICORN_THREADS: "1"
      GUNICORN_WORKER_CLASS: sync
    healthcheck: *py-ready

  hub-ingest-telemetry:
    <<: *app
    command:
      - /app/deploy/entrypoint-drain.sh
      - gunicorn
      - hub.wsgi_ingest:application
      - -c
      - deploy/gunicorn.py
    environment:
      <<: *app-env
      DJANGO_SETTINGS_MODULE: hub.settings.ingest
      HUB_INGEST_ROLE: telemetry
      HUB_DB_INGEST_URL: postgresql+psycopg://hub_ingest:${PG_INGEST_PW:-dev}@pgbouncer:6432/hub_rw
      # Batch ingest is I/O bound, so threads rather than processes.
      GUNICORN_WORKERS: "3"
      GUNICORN_THREADS: "8"
      GUNICORN_WORKER_CLASS: gthread
    healthcheck: *py-ready

  hub-stream:
    <<: *app
    command:
      - uvicorn
      - hub.asgi_stream:application
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      # One process per container, scaled by replicas (`server-template stream 2`): uvicorn's
      # multi-worker supervisor kills a worker that misses a 5 s healthcheck while the machine
      # is busy starting the rest of the stack, which is exactly when a slow first import
      # happens, and two processes in one container would also race for the metrics port.
      - --workers
      - "1"
      - --timeout-graceful-shutdown
      - "30"
      - --timeout-keep-alive
      - "75"
    environment:
      <<: *app-env
      DJANGO_SETTINGS_MODULE: hub.settings.stream
      HUB_DB_API_REPLICA_URL: postgresql+psycopg://hub_api:${PG_API_PW:-dev}@pgbouncer:6432/hub_ro
    healthcheck: *py-ready

  hub-worker:
    <<: *app
    command: ["python", "manage.py", "run_worker", "--settings=hub.settings.worker"]
    environment:
      <<: *app-env
      DJANGO_SETTINGS_MODULE: hub.settings.worker
      HUB_DB_WORKER_URL: postgresql+psycopg://hub_worker:${PG_WORKER_PW:-dev}@pgbouncer:6432/hub_rw
    healthcheck: *worker-ready

  hub-relay:
    <<: *app
    command: ["python", "manage.py", "run_relay", "--settings=hub.settings.worker"]
    environment:
      <<: *app-env
      DJANGO_SETTINGS_MODULE: hub.settings.worker
      HUB_DB_WORKER_URL: postgresql+psycopg://hub_worker:${PG_WORKER_PW:-dev}@pgbouncer:6432/hub_rw
    healthcheck: *worker-ready

  hub-scheduler:
    <<: *app
    command: ["python", "manage.py", "run_scheduler", "--settings=hub.settings.worker"]
    environment:
      <<: *app-env
      DJANGO_SETTINGS_MODULE: hub.settings.worker
      HUB_DB_WORKER_URL: postgresql+psycopg://hub_worker:${PG_WORKER_PW:-dev}@pgbouncer:6432/hub_rw
    healthcheck: *worker-ready

  # The `be_web` pool. The stub stands in for the Next.js shell and answers /web/health on the
  # same port, so nothing about the balancer changes when `make up WEB=real` swaps the image.
  hub-web:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    volumes:
      - ./hub-web-stub/default.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      NEXT_PUBLIC_API_BASE: /api/v1
      NEXT_PUBLIC_DEFAULT_LOCALE: fr
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      # The demo shell's two server-only values (docs/plan/frontend/demo-shell-plan.md section 6):
      # the provider double's control token and the address it answers on inside this network. The
      # route handlers under src/app/api/demo read both, server-side, and the browser never sees
      # either. The nginx stub ignores them; `make up WEB=real` is where they matter, and a demo
      # whose sandbox buttons answered "token not set" would be a broken demo.
      STUB_CONTROL_TOKEN: ${STUB_CONTROL_TOKEN:?set STUB_CONTROL_TOKEN in .env (make env)}
      PROVIDER_STUB_BASE_URL: http://provider-stub:9100
    stop_grace_period: 20s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/web/health"]
      interval: 5s
      timeout: 3s
      retries: 3

  # --- data plane ---------------------------------------------------------------------------
  pg-primary:
    image: postgres:16
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=5
      - -c
      - hot_standby=on
      - -c
      - shared_preload_libraries=pg_stat_statements
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PG_OWNER_PW:-dev}
      # Nothing is created implicitly: pg-init/00-create-db.sh creates `hub` by name, and the
      # schema inside it comes from the baseline migration only (ADR-0020).
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./pg-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hub"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The baseline creates the roles NOLOGIN; this is the local stand-in for the deployment step
  # that adds LOGIN and a rotated password (docs/04 10.5). Idempotent, so `make up` twice is safe.
  db-logins:
    image: postgres:16
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGPASSWORD: ${PG_OWNER_PW:-dev}
    volumes:
      # Kept outside pg-init: everything in that directory runs once at first boot, and this
      # file must run after the baseline has created the roles it alters.
      - ./db-logins/logins.sql:/logins.sql:ro
    command:
      - psql
      - -h
      - pg-primary
      - -U
      - postgres
      - -d
      - hub
      - -f
      - /logins.sql
      - -v
      - api_pw=${PG_API_PW:-dev}
      - -v
      - ingest_pw=${PG_INGEST_PW:-dev}
      - -v
      - worker_pw=${PG_WORKER_PW:-dev}
      - -v
      - migrator_pw=${PG_MIGRATOR_PW:-dev}
      - -v
      - analytics_pw=${PG_ANALYTICS_PW:-dev}
    restart: "no"

  migrate:
    <<: *app
    command: ["python", "manage.py", "migrate", "--noinput", "--settings=hub.settings.migrate"]
    environment:
      <<: *app-env
      DJANGO_SETTINGS_MODULE: hub.settings.migrate
      # Superuser for the first run only: 0000_baseline.sql creates roles, ownership and grants.
      # Point this at `migrator` once the baseline has been applied (docs/04 10.5).
      HUB_MIGRATE_URL: postgresql+psycopg://postgres:${PG_OWNER_PW:-dev}@pg-primary:5432/hub
    depends_on:
      pg-primary:
        condition: service_healthy
    restart: "no"
    healthcheck:
      disable: true

  pgbouncer:
    # docs/09 1.3 names edoburu/pgbouncer, but that repository publishes v1.23.1-pN tags and no
    # plain 1.23.1; the official image carries the same version. Its entrypoint would generate
    # a config from environment variables, so the binary is exec'd with our own file instead.
    image: pgbouncer/pgbouncer:1.23.1
    entrypoint: ["/opt/pgbouncer/pgbouncer", "/etc/pgbouncer/pgbouncer.ini"]
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      # Written by tools/scripts/gen_dev_userlist.sh before `up`; git-ignored.
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      pg-primary:
        condition: service_healthy
    healthcheck:
      # The image ships no libpq client, so the probe is a TCP connect: it proves the listener is
      # up, and the application's own readiness probe proves the whole path to PostgreSQL works.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6432"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - volatile-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Object storage for attachments and AI payloads. The upstream minio/minio repository no
  # longer publishes images (the reference now resolves to nothing), so this is MinIO's own
  # binary from Bitnami's archived catalogue, still pinned to a dated release tag as the plan
  # asks. It runs as UID 1001 and keeps its data under /bitnami/minio/data.
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    environment:
      # MinIO refuses a root password shorter than 8 characters; a 3-letter default would
      # abort the entrypoint after a minute of retries instead of failing at the first line.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dev}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dev-dev-dev}
      MINIO_DEFAULT_BUCKETS: hub-local
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  # --- observability ------------------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ../observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"

  # --- stubs, on the `stubs` profile so a plain `make up` stays quiet -----------------------
  # `provider-stub` is real from slice T1: it is the mobile-money provider the hub's adapter
  # calls, and the things it delivers are the signed webhooks slice 04 verifies. `meter-sim` is
  # still a placeholder until slice T2.
  provider-stub:
    image: soleil/provider-stub:${TAG:-dev}
    build:
      context: ../..
      dockerfile: tools/provider_stub/Dockerfile
    profiles: ["stubs"]
    environment:
      # One secret per registered channel, plus the control token: `config.load()` has no
      # defaults and refuses to start without them (that is what makes a hub signature test
      # mean something). The values are the development ones `make env` writes; a deployed
      # environment passes its own through its secret store.
      STUB_SECRET_MPESA_CD: ${STUB_SECRET_MPESA_CD:?set STUB_SECRET_MPESA_CD in .env (make env)}
      STUB_SECRET_AIRTEL_CD: ${STUB_SECRET_AIRTEL_CD:?set STUB_SECRET_AIRTEL_CD in .env (make env)}
      STUB_SECRET_ORANGE_CD: ${STUB_SECRET_ORANGE_CD:?set STUB_SECRET_ORANGE_CD in .env (make env)}
      STUB_SECRET_SYNTHETIC: ${STUB_SECRET_SYNTHETIC:?set STUB_SECRET_SYNTHETIC in .env (make env)}
      STUB_CONTROL_TOKEN: ${STUB_CONTROL_TOKEN:?set STUB_CONTROL_TOKEN in .env (make env)}
      # The balancer, not a pool container: the double posts to the same route a real provider
      # would, which is the only way the signature, the routing and the ingest grants all get
      # exercised together.
      STUB_HUB_BASE_URL: http://lb:8080
      STUB_JOURNAL_PATH: /var/lib/provider_stub/journal.jsonl
      STUB_SIMULATE_LATENCY: "1"
      # The seed fixes the statement renderer and the `event_id` sequence (slice T1 step T1.3).
      # A run that repeats the same flow therefore sends the same ids, which the hub correctly
      # answers `duplicate` — so the slice 04 end-to-end module recreates this service under a
      # seed of its own before it runs. The default here is the plain `make up` value.
      STUB_SEED: ${STUB_SEED:-20261027}
      # Seconds before the double settles a collection on its own if nothing calls its control API
      # first (tools/provider_stub/src/provider_stub/config.py). The demo shell's sandbox panel
      # (frontend/README.md "The two payment outcomes") depends on this being 0 so its own click is
      # the cause rather than a race against a timer; `make up`'s default of 5 is for poking the
      # API by hand, where a free auto-settle is convenient.
      STUB_AUTO_CONFIRM_SECONDS: ${STUB_AUTO_CONFIRM_SECONDS:-5}
    volumes:
      - providerstubdata:/var/lib/provider_stub
    ports:
      - "9100:9100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:9100/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    # The double writes a journal and pip's cache is off, so its root stays read-only apart from
    # the volume — the same posture the hub-* containers have.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  meter-sim:
    image: busybox:1.36
    profiles: ["stubs"]
    command: ["sh", "-c", "echo 'placeholder: see slice-T2 (meter simulator)'; sleep infinity"]

volumes:
  pgdata:
  redisdata:
  miniodata:
  haproxy-run:
  # The double's journal: a restart replays it, so a status pull still matches the webhook it
  # already sent (slice T1 review focus 4).
  providerstubdata:
