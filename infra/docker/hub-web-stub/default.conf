# Stand-in for the Next.js shell (D-44): the `be_web` pool answers on port 3000 exactly as
# the real image will, so the balancer, its health check and the cache headers of docs/09 1.4
# are exercised from slice 00 onwards. `make up WEB=real` replaces this with frontend/.
#
# It runs unprivileged (UID 101) on a read-only filesystem: the only writable paths nginx
# needs are under /tmp, which compose mounts as a tmpfs.

server {
    listen 3000;
    server_name _;

    # The pool health check (docs/09 1.4): cheap, no logging, no caching.
    location = /web/health {
        access_log off;
        add_header Cache-Control "no-store" always;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / {
        default_type text/html;
        return 200 '<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <title>Soleil Grid Hub</title>
  </head>
  <body>
    <main>
      <h1>hub-web stub</h1>
      <p>Slice 00 placeholder. The Next.js shell replaces this page (fe-00).</p>
    </main>
  </body>
</html>
';
    }

    # Anything else is not part of the skeleton yet; say so instead of pretending 200.
    location / {
        default_type text/plain;
        return 404 "hub-web stub: not part of slice 00\n";
    }
}
