        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createApiKey
      summary: Propose an API key
      tags:
      - ApiKeys
      description: Format sgh_<env>_<keyid>_<secret>. Kinds gateway and integrator have disjoint scopes. Gateway
        keys need site_ids and allowed_cidrs. Expiry is required, at most 180 days (422 validation_error otherwise).
        Second administrator approves; the secret is revealed once on execution.
      security:
      - bearerJwt: []
      x-fr:
      - FR-18
      x-roles:
      - administrator
      x-step-up:
        max_age_seconds: 300
        problem_code: step_up_required
      x-approval: api_key_creation
      x-rate-limit-tier: staff
      x-pool: be_api
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiKeyCreate'
            example:
              name: Meter gateway Kasenga
              kind: gateway
              scopes:
              - telemetry:write
              - tokens:acknowledge
              - gateway:heartbeat
              site_ids:
              - 0192f3a4-7b1c-7d2e-8a3f-5c6d7e8f000a
              allowed_cidrs:
              - 203.0.113.0/24
              rate_limit_tier: gateway
              expires_at: '2027-03-01T00:00:00Z'
              reason: New gateway at Kasenga
      responses:
        '202':
          description: 'Accepted: pending approval. The key secret is returned once, only to the maker, in GET /approvals/{id}
            result.api_key_secret after execution.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            Location:
              $ref: '#/components/headers/Location'
            Idempotency-Key:
              $ref: '#/components/headers/IdempotencyKey'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Approval'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-approval-notes:
      - Second administrator approves every key.
      - 'all_sites: true (integrator keys only) additionally needs a second approver beyond the normal one (two
        approvals from two administrators other than the maker).'
      - Gateway keys must list site_ids and allowed_cidrs; all_sites is not allowed for them.
