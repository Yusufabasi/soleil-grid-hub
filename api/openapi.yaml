      schema:
        type: string
        format: uuid
      required: true
  headers:
    XRequestId:
      description: Correlation id for this request; appears in logs, traces and error bodies.
      schema:
        type: string
    RateLimitLimit:
      description: Requests allowed in the current window for this tier (IETF RateLimit header fields).
      schema:
        type: integer
    RateLimitRemaining:
      description: Requests left in the current window.
      schema:
        type: integer
    RateLimitReset:
      description: Seconds until the window resets.
      schema:
        type: integer
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
    IdempotencyKey:
      description: Echo of the Idempotency-Key the server applied.
      schema:
        type: string
    IdempotentReplayed:
      description: true when this response is a stored replay of an earlier identical request.
      schema:
        type: boolean
    ETag:
      description: Entity tag (weak, derived from version); send as If-Match on update.
      schema:
        type: string
    Location:
      description: URL of the created or accepted resource, relative to the server root.
      schema:
        type: string
    Deprecation:
      description: RFC 9745 deprecation marker; present on deprecated operations.
      schema:
        type: string
    Sunset:
      description: HTTP-date after which the operation returns 410 Gone.
      schema:
        type: string
    SetCookieRefresh:
      description: 'sg_refresh=<opaque>; HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth; Max-Age=<seconds>.
        Browsers only. Staff: idle 30 min, absolute 8 h; customers: idle 5 min, absolute 12 h. Cleared (Max-Age=0)
        on logout and reuse detection.'
      schema:
        type: string
    WWWAuthenticate:
      description: 'On step_up_required: Bearer error="insufficient_user_authentication", max_age=300'
      schema:
        type: string
  responses:
    BadRequest:
      description: 'Malformed or stale request. Codes: invalid_request, idempotency_key_required, invalid_cursor,
        stale_timestamp (webhook timestamp outside the 300 s window).'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            invalid_request:
              value:
                type: https://api.soleilgrid.example/problems/invalid_request
                title: Malformed request
                status: 400
                code: invalid_request
                detail: Request body is not valid JSON.
                request_id: req_01JC8Z4N6Q
    Unauthorized:
      description: 'Missing or invalid credentials, or a recent authentication is needed. Codes: unauthenticated,
        token_expired, invalid_credentials, mfa_invalid, otp_invalid, refresh_token_reused, invalid_signature, step_up_required
        (re-authenticate through POST /auth/step-up, then retry).'
