                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/refresh:
    post:
      operationId: refreshToken
      summary: Rotate the refresh token
      tags:
      - Auth
      description: 'CSRF: requires header X-Hub-CSRF: 1 and Origin equal to the site origin (403 csrf_check_failed).
        Browsers send the sg_refresh cookie (SameSite=Strict, Path=/api/v1/auth), no body, and a custom header check
        applies; the new refresh token comes back in Set-Cookie. Non-browser clients send the token in the body
        and receive it in the body. Single-use rotation, reuse detection per family, NO grace window: a spent token
        revokes the family (401 refresh_token_reused) and clears the cookie.'
      security:
      - refreshCookie: []
      - {}
      x-fr:
      - FR-15
      x-roles:
      - public
      x-rate-limit-tier: auth
      x-pool: be_api
      parameters:
      - $ref: '#/components/parameters/TokenTransport'
      - $ref: '#/components/parameters/HubCsrf'
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: OK.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            Set-Cookie:
              $ref: '#/components/headers/SetCookieRefresh'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
