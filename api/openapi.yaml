                title: Authentication required
                status: 401
                code: unauthenticated
                detail: Bearer token missing or expired.
                request_id: req_01JC8Z4N6Q
    Forbidden:
      description: 'Authenticated but not permitted. Codes: forbidden, insufficient_scope, self_approval_forbidden,
        conflict_of_interest, site_not_permitted, csrf_check_failed (cookie-authenticated operations only).'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            forbidden:
              value:
                type: https://api.soleilgrid.example/problems/forbidden
                title: Forbidden
                status: 403
                code: forbidden
                detail: Your role does not allow this operation.
                request_id: req_01JC8Z4N6Q
    NotFound:
      description: 'Missing or not visible to the caller (indistinguishable by design). Code: not_found.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            not_found:
              value:
                type: https://api.soleilgrid.example/problems/not_found
                title: Not found
                status: 404
                code: not_found
                detail: Customer not found.
                request_id: req_01JC8Z4N6Q
    Conflict:
      description: 'State conflict. Codes: conflict, state_conflict, duplicate_resource, serial_conflict, idempotency_in_progress,
        customer_has_balance, period_locked, approval_required, approval_payload_mismatch, statement_already_imported,
        erasure_blocked, recall_window_closed, money_co_approval_required.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            state_conflict:
              value:
                type: https://api.soleilgrid.example/problems/state_conflict
                title: State conflict
                status: 409
                code: state_conflict
                detail: The top-up is no longer pending.
                request_id: req_01JC8Z4N6Q
    PreconditionFailed:
      description: 'If-Match did not match the current ETag. Code: precondition_failed.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            precondition_failed:
              value:
                type: https://api.soleilgrid.example/problems/precondition_failed
                title: Precondition failed
                status: 412
                code: precondition_failed
                detail: Resource changed since you read it; re-fetch and retry.
                request_id: req_01JC8Z4N6Q
    ValidationError:
      description: 'Valid JSON but semantically invalid. Codes: validation_error, amount_out_of_range, currency_mismatch,
        currency_change_blocked, meter_not_active, idempotency_key_reuse, sql_rejected, proof_required, attachment_rejected,
        evidence_required, draft_lint_failed, tariff_change_too_large.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            validation_error:
              value:
                type: https://api.soleilgrid.example/problems/validation_error
                title: Request validation failed
                status: 422
                code: validation_error
                detail: One or more fields are invalid.
                request_id: req_01JC8Z4N6Q
    PreconditionRequired:
      description: 'If-Match is required for this update. Code: precondition_required.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            precondition_required:
              value:
                type: https://api.soleilgrid.example/problems/precondition_required
                title: Precondition required
                status: 428
                code: precondition_required
                detail: Send If-Match with the ETag from your last read.
                request_id: req_01JC8Z4N6Q
    RateLimited:
      description: 'Rate limit or budget. Codes: rate_limited, otp_rate_limited, topup_limit, budget_exceeded (dollar
        budget for a ticket, feature, customer or key).'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            rate_limited:
              value:
                type: https://api.soleilgrid.example/problems/rate_limited
                title: Too many requests
                status: 429
                code: rate_limited
                detail: Rate limit exceeded; retry after the indicated delay.
                request_id: req_01JC8Z4N6Q
    InternalError:
      description: 'Unexpected failure; no internal detail is exposed. Code: internal_error.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            internal_error:
              value:
                type: https://api.soleilgrid.example/problems/internal_error
                title: Internal error
                status: 500
                code: internal_error
                detail: An unexpected error occurred. Quote the request id to support.
                request_id: req_01JC8Z4N6Q
    Unavailable:
      description: 'Dependency or overload; retry with backoff. Codes: service_unavailable, ai_unavailable.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            service_unavailable:
              value:
                type: https://api.soleilgrid.example/problems/service_unavailable
                title: Service unavailable
                status: 503
                code: service_unavailable
                detail: The service is temporarily overloaded.
                request_id: req_01JC8Z4N6Q
    PayloadTooLarge:
      description: 'Body too large. Code: payload_too_large (telemetry batch over 1,000 readings or 256 KB).'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            payload_too_large:
              value:
                type: https://api.soleilgrid.example/problems/payload_too_large
                title: Payload too large
                status: 413
                code: payload_too_large
                detail: Batch exceeds 256 KB.
                request_id: req_01JC8Z4N6Q
  schemas:
    Money:
      type: object
      properties:
        amount_minor:
          type: integer
          description: Integer count of minor units (cents for USD, centimes for CDF). Never a float.
          format: int64
        currency:
          type: string
          enum:
          - USD
          - CDF
      required:
      - amount_minor
      - currency
      description: Money as integer minor units plus ISO-4217 currency. Amounts in requests and ledger lines are
        positive; the sign is carried by `direction` (D-03).
      examples:
      - amount_minor: 500
        currency: USD
    FieldError:
      type: object
      properties:
        field:
          type: string
          description: JSON pointer to the offending field, e.g. /amount/amount_minor
        code:
          type: string
          description: Stable machine code, e.g. out_of_range
        message:
          type: string
      required:
      - field
      - code
      - message
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
          description: URI reference identifying the problem type (stable, documented in docs/05-api-design.md).
        title:
          type: string
          description: Short, human-readable summary; not for program logic.
        status:
          type: integer
          description: HTTP status code, repeated for convenience.
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence. Never contains stack traces, SQL
            or personal data.
        instance:
          type: string
          description: Request path of this occurrence.
        code:
          type: string
          pattern: ^[a-z0-9_]+$
          description: Stable machine-readable error code. Clients branch on this, never on title or detail.
        request_id:
          type: string
          description: Equals the X-Request-Id response header; quote it to support.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
          description: Field-level details, present for validation errors.
        retry_after_seconds:
          type: integer
          description: Present on 429 and 503; equals the Retry-After header.
        step_up:
          type: object
          properties:
            max_age_seconds:
              type: integer
            methods:
              type: array
              items:
                type: string
                enum:
                - totp
                - webauthn
          description: Present on step_up_required.
        approval_id:
          type: string
          format: uuid
          description: Present on approval_required.
      required:
      - type
      - title
      - status
      - code
      - request_id
      description: RFC 9457 problem details, served as application/problem+json.
      examples:
      - type: https://api.soleilgrid.example/problems/validation_error
        title: Request validation failed
        status: 422
        code: validation_error
        request_id: req_01JC8Z4N6Q
        instance: /api/v1/top-ups
        errors:
        - field: /amount/amount_minor
          code: out_of_range
          message: Must be between 100 and 50000 for plan RES-LITE.
    PageMeta:
      type: object
      properties:
        has_next:
          type: boolean
        next_cursor:
          type:
          - string
          - 'null'
          description: Opaque; pass as ?cursor= to get the next page. Null on the last page.
        limit:
          type: integer
      required:
      - has_next
      - next_cursor
      - limit
      description: Cursor pagination metadata. No total count is returned (cost at 300,000 rows).
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 12
          maxLength: 256
      required:
      - email
      - password
    Principal:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
          - staff
          - customer
          - integrator
          - gateway
        display_name:
          type: string
        roles:
          type: array
          items:
            type: string
            enum:
            - customer
            - support_agent
            - finance_officer
            - operations_engineer
            - administrator
            - integrator
            - gateway
        attributes:
          type: array
          items:
            type: string
            enum:
            - finance_lead
            - dp_admin
          description: User attributes, not roles (D-13).
        scopes:
          type: array
          items:
            type: string
        site_ids:
          type: array
          items:
            type: string
            format: uuid
          description: Assigned sites (staff) or bound sites (gateway key).
        locale:
          type: string
          enum:
          - en
          - fr
        mfa_enrolled:
          type: boolean
        acr:
          type: string
          description: 'Authentication context: pwd, mfa or phr (WebAuthn).'
        auth_time:
          type: string
          format: date-time
          description: Time of the last primary or step-up authentication.
      required:
      - id
      - type
      - display_name
      - roles
      - locale
    MfaChallenge:
      type: object
      properties:
        mfa_required:
          type: boolean
        mfa_token:
          type: string
          description: Opaque single-use 5-minute challenge; not an access token.
        mfa_token_expires_in:
          type: integer
        enrollment_required:
          type: boolean
        methods:
          type: array
          items:
            type: string
            enum:
            - totp
            - webauthn
            - recovery_code
          description: Methods the account may use; WebAuthn only for finance_officer and administrator once enrolled.
      required:
      - mfa_required
      - mfa_token
      - mfa_token_expires_in
      - enrollment_required
      - methods
    MfaVerifyRequest:
      type: object
      properties:
        mfa_token:
          type: string
        totp_code:
          type: string
          pattern: ^[0-9]{6}$
        recovery_code:
          type: string
          description: One-time backup code (single use); all remaining codes are flagged and the user alerted.
      required:
      - mfa_token
      description: Provide totp_code or recovery_code.
    MfaEnrollRequest:
      type: object
      properties:
        mfa_token:
          type: string
      required:
      - mfa_token
    MfaEnrollment:
      type: object
      properties:
        otpauth_uri:
          type: string
          description: otpauth:// URI to render as a QR code; shown once.
        recovery_codes:
          type: array
          items:
            type: string
          description: Ten single-use recovery codes; shown once.
      required:
      - otpauth_uri
      - recovery_codes
    MfaEnrollConfirmRequest:
      type: object
      properties:
        mfa_token:
          type: string
        totp_code:
          type: string
          pattern: ^[0-9]{6}$
      required:
      - mfa_token
      - totp_code
    TokenPair:
      type: object
      properties:
        access_token:
          type: string
          description: 'EdDSA JWT, 10 minutes. Claims: sub, typ, roles, scp, site_ids, locale, tv (token version),
            acr, amr, auth_time, iat, exp, jti.'
        token_type:
          type: string
          enum:
          - Bearer
        expires_in:
          type: integer
          examples:
          - 600
        refresh_token:
          type: string
          description: 'Present ONLY for non-browser clients that sent X-Token-Transport: body. Browsers never receive
            it in the body; it is set as an HttpOnly cookie.'
        refresh_expires_in:
          type: integer
        principal:
          $ref: '#/components/schemas/Principal'
      required:
      - access_token
      - token_type
      - expires_in
      - principal
    RefreshRequest:
      type: object
      properties:
        refresh_token:
          type: string
          description: 'Body transport for non-browser clients only. Browsers send nothing: the sg_refresh cookie
            is read.'
      description: 'Optional body. Rotation is single use with reuse detection per family and no grace window: a
        spent token revokes the family.'
    LogoutRequest:
      type: object
      properties:
        refresh_token:
          type: string
          description: If given, this refresh token family is revoked; otherwise the current session only.
    OtpRequest:
      type: object
      properties:
        phone_e164:
          type: string
          pattern: ^\+[1-9][0-9]{7,14}$
          description: E.164 phone number
        locale:
          type: string
          enum:
          - en
          - fr
        proof_token:
          type: string
          description: Solved proof-of-work or CAPTCHA token from GET /auth/proof-challenge; required (missing or
            invalid gives 422 proof_required, still no SMS).
      required:
      - phone_e164
      - proof_token
    OtpChallenge:
      type: object
      properties:
        challenge_id:
          type: string
          format: uuid
        expires_in:
          type: integer
        resend_after:
          type: integer
          description: Seconds before another code may be requested.
      required:
      - challenge_id
      - expires_in
      - resend_after
    OtpVerifyRequest:
      type: object
      properties:
        challenge_id:
          type: string
          format: uuid
        code:
          type: string
          pattern: ^[0-9]{6}$
      required:
      - challenge_id
      - code
      description: Failures are counted per challenge (5 wrong codes kill the challenge) as well as per phone and
        network. Customers dormant for 90 days must verify again.
    MeUpdate:
      type: object
      properties:
        display_name:
          type: string
        locale:
          type: string
          enum:
          - en
          - fr
    NotificationPreferences:
      type: object
      properties:
        sms_enabled:
          type: boolean
        email_enabled:
          type: boolean
        low_balance_threshold:
          $ref: '#/components/schemas/Money'
        quiet_hours:
          type:
          - object
          - 'null'
          additionalProperties: true
          description: Local-time window {start, end} in HH:MM during which non-critical notifications are held.
      required:
      - sms_enabled
      - email_enabled
    Customer:
      type: object
      properties:
        id:
          type: string
          format: uuid
        customer_number:
          type: string
        full_name:
          type: string
        phone_e164:
          type: string
          pattern: ^\+[1-9][0-9]{7,14}$
          description: E.164 phone number
        email:
          type:
          - string
          - 'null'
          format: email
        locale:
          type: string
          enum:
          - en
          - fr
        status:
          type: string
          enum:
          - active
          - suspended
          - closed
          - erased
        site_id:
          type: string
          format: uuid
        plan_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          type: integer
          description: Optimistic-concurrency version, mirrored in ETag.
      required:
      - id
      - customer_number
      - full_name
      - phone_e164
      - locale
      - status
      - site_id
      - plan_id
      - created_at
      - updated_at
      - version
