      operationId: registerWebauthnCredential
      summary: Register a WebAuthn credential
      tags:
      - Auth
      description: Required for finance_officer and administrator before go-live.
      security:
      - bearerJwt: []
      x-fr:
      - FR-15
      x-roles:
      - support_agent
      - finance_officer
      - operations_engineer
      - administrator
      x-step-up:
        max_age_seconds: 300
