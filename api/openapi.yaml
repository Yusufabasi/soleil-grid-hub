# Soleil Grid Hub API, OpenAPI 3.1 (revision 1). Owner: API designer. Companions: docs/05-api-design.md, api/permissions.yaml
# x-roles is generated from api/permissions.yaml. Enumerations follow db/schema.sql (D-01), checked by tests/test_alignment.py.
openapi: 3.1.0
info:
  title: Soleil Grid Hub API
  version: 1.1.0
  summary: Prepaid solar mini-grid platform API
  description: |-
    Public and internal HTTP API of **Soleil Grid Hub** (design phase; revision 1). Authoritative companions: `docs/05-api-design.md`, `api/permissions.yaml` (roles per operation), `db/schema.sql` (every enumeration, D-01).

    * Base path `/api/v1`; URL-path versioning; additive changes only within a version. Path-routed pools: `/webhooks/providers/*` (be_webhooks), `/telemetry/*` and `/gateway/*` (be_telemetry), `/dashboard/stream` (be_stream), the rest be_api (`x-pool`).
    * Success bodies `{"data": ...}`; lists add `meta` (cursor pagination). Errors are `application/problem+json` with a stable `code`.
    * Money is `{amount_minor, currency}`; ids UUIDv7; timestamps RFC 3339 UTC.
    * Idempotency-Key is required on money-moving and action writes (7 days for top-ups, 24 hours elsewhere); the provider webhook is deduplicated by the provider event id in the body, not by Idempotency-Key.
    * Versioned resources (customers, meters, tickets, drafts, KB articles) require `If-Match`.
    * Every operation declares `x-fr`, `x-roles` (generated from permissions.yaml), `x-rate-limit-tier`, `x-pool`; where relevant `x-step-up`, `x-approval`, `x-requires-attribute`, `x-ownership`, `x-site-scoped`.
    * Principals: roles customer, support_agent, finance_officer, operations_engineer, administrator; machine schemes gateway, integrator (API-key kinds), provider (HMAC), public. The administrator has no money, ticket, customer-content or ask-the-data operation.
    * Invariants: no model-controlled write path; AI text reaches customers only through an approved draft; a payment is applied at most once; no ledger write endpoint.
  contact:
    name: Soleil Grid Hub platform team
    email: platform@soleilgrid.example
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://hub.soleilgrid.example/api/v1
  description: Public origin; the balancer routes by path prefix to be_webhooks, be_telemetry, be_stream or be_api
- url: http://localhost:8000/api/v1
  description: Local development (docker compose)
tags:
- name: Auth
  description: Staff login with MFA, token refresh, customer one-time-code login.
- name: Customers
  description: Customer registry, sites and plans (FR-01).
- name: Meters
  description: Meter registry, readings and assignment (FR-01, FR-06).
- name: TopUps
  description: Prepaid top-up initiation and status (FR-02).
- name: Tokens
  description: Energy-credit tokens issued to meters (FR-05).
- name: Webhooks
  description: Inbound provider webhooks and the webhook event log (FR-03).
- name: Telemetry
  description: Meter gateway batch ingestion (FR-06).
- name: Ledger
  description: Read-only double-entry ledger (FR-04).
- name: Alerts
  description: Alerts and alert rules (FR-07).
- name: Tickets
  description: Support tickets and messages (FR-08).
- name: AI
  description: Triage, reply drafts with human approval, summaries, AI usage (FR-09, FR-10, FR-11).
- name: AskTheData
  description: Natural-language questions to read-only, role-scoped SQL (FR-12).
- name: Dashboard
  description: Operations dashboard summary and SSE stream (FR-13).
- name: Reconciliation
  description: Provider statement reconciliation and exception queue (FR-14).
- name: Approvals
  description: Maker-checker approvals bound to a payload hash (D-15).
- name: Admin
  description: Users, roles, audit log (FR-15).
- name: ApiKeys
  description: Integrator API key management (FR-18).
- name: KnowledgeBase
  description: Versioned knowledge-base articles (FR-17).
- name: Notifications
  description: Notification outbox, templates and preferences (FR-19).
- name: Privacy
  description: Data export, erasure and retention (FR-20).
- name: Health
  description: Liveness and readiness probes.
security:
- bearerJwt: []
paths:
  /auth/staff/login:
    post:
      operationId: staffLogin
      summary: Staff login, step 1 (password)
      tags:
      - Auth
      description: Company IdP over OIDC is preferred; this local-account flow exists for break-glass and for sites
        without the IdP. Never returns an access token. Wrong password and unknown account are indistinguishable;
        progressive lockout per account and per IP.
      security: []
      x-fr:
      - FR-15
      x-roles:
      - public
      x-rate-limit-tier: auth
      x-pool: be_api
      parameters:
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: amina.k@soleilgrid.example
              password: correct horse battery staple
      responses:
        '200':
          description: OK.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/MfaChallenge'
              example:
                data:
                  mfa_required: true
                  mfa_token: mfa_0192f3a4c7
                  mfa_token_expires_in: 300
                  enrollment_required: false
                  methods:
                  - totp
                  - webauthn
                  - recovery_code
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/oidc/start:
    get:
      operationId: oidcStart
      summary: Start company-IdP sign-in (redirect)
      tags:
      - Auth
      description: 'D-47: hub-api is the confidential OIDC client. Responds 302 to the company identity provider
        authorization endpoint with PKCE (S256 code_challenge), a state value bound to the browser by the short-lived
        cookie, and a nonce. hub-web only triggers this redirect; it holds no client secret.'
      security: []
      x-fr:
      - FR-15
      x-roles:
      - public
      x-rate-limit-tier: auth
      x-pool: be_api
      parameters:
      - name: return_to
        in: query
        description: Optional same-site relative path to return to after sign-in; anything else is ignored.
        schema:
          type: string
      - $ref: '#/components/parameters/RequestId'
      responses:
        '302':
          description: Found (redirect).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            Location:
              $ref: '#/components/headers/Location'
            Set-Cookie:
              description: sg_oidc_state=<opaque>; HttpOnly; Secure; SameSite=Lax; Path=/api/v1/auth/oidc; Max-Age=600.
                Binds the state value to this browser.
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/oidc/callback:
    get:
      operationId: oidcCallback
      summary: Complete company-IdP sign-in (code exchange)
      tags:
      - Auth
      description: 'D-47: hub-api exchanges the code (PKCE verifier, client authentication) with the identity provider,
        validates the ID token (issuer, audience, nonce, MFA claim), maps it to a staff user, and answers 302 to
        the web application. The refresh token is set as the sg_refresh cookie only; the access token is obtained
        by the web app through POST /auth/refresh. The provider tokens never reach the browser. Failures are problem+json
        (not redirects): 400 invalid_request for a missing code or state mismatch, 401 unauthenticated when the
        IdP identity maps to no active staff user or MFA is not asserted, 429 rate_limited.'
      security: []
      x-fr:
      - FR-15
      x-roles:
      - public
      x-rate-limit-tier: auth
      x-pool: be_api
      parameters:
      - name: code
        in: query
        description: Authorization code from the identity provider.
        schema:
          type: string
      - name: state
        in: query
        description: Must equal the value bound by the sg_oidc_state cookie.
        schema:
          type: string
      - name: error
        in: query
        description: Error code from the identity provider, if any.
        schema:
          type: string
      - $ref: '#/components/parameters/RequestId'
      responses:
        '302':
          description: Found (redirect).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            Location:
              $ref: '#/components/headers/Location'
            Set-Cookie:
              $ref: '#/components/headers/SetCookieRefresh'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/staff/mfa/verify:
    post:
      operationId: staffMfaVerify
      summary: Staff login, step 2 (TOTP or recovery code)
      tags:
      - Auth
      description: 'Returns the access token in the body and the refresh token in the Set-Cookie header (browsers)
        or in the body when X-Token-Transport: body (non-browser clients).'
      security: []
      x-fr:
      - FR-15
      x-roles:
      - public
      x-rate-limit-tier: auth
      x-pool: be_api
      parameters:
      - $ref: '#/components/parameters/TokenTransport'
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerifyRequest'
            example:
              mfa_token: mfa_0192f3a4c7
              totp_code: '493021'
      responses:
        '200':
          description: OK.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            Set-Cookie:
              $ref: '#/components/headers/SetCookieRefresh'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/TokenPair'
              example:
                data:
                  access_token: eyJhbGciOiJFZERTQSIsImtpZCI6ImsxIn0.eyJzdWIiOiIwMTkyZi4uLiJ9.sig
                  token_type: Bearer
                  expires_in: 600
                  refresh_expires_in: 28800
                  principal:
                    id: 0192f3a4-7b1c-7d2e-8a3f-5c6d7e8f0032
                    type: staff
                    display_name: Amina K.
                    roles:
                    - finance_officer
                    attributes:
                    - finance_lead
                    scopes: []
                    site_ids:
                    - 0192f3a4-7b1c-7d2e-8a3f-5c6d7e8f000a
                    locale: fr
                    mfa_enrolled: true
                    acr: mfa
                    auth_time: '2026-10-24T08:15:30Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/staff/mfa/enrollments:
    post:
      operationId: startMfaEnrollment
      summary: Start TOTP enrollment
      tags:
      - Auth
      security: []
      x-fr:
      - FR-15
      x-roles:
      - public
      x-rate-limit-tier: auth
      x-pool: be_api
      parameters:
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaEnrollRequest'
      responses:
        '201':
          description: Created.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/MfaEnrollment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/staff/mfa/enrollments/confirm:
    post:
      operationId: confirmMfaEnrollment
      summary: Confirm TOTP enrollment and sign in
      tags:
      - Auth
      security: []
      x-fr:
      - FR-15
      x-roles:
      - public
      x-rate-limit-tier: auth
      x-pool: be_api
      parameters:
      - $ref: '#/components/parameters/TokenTransport'
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaEnrollConfirmRequest'
      responses:
        '200':
          description: OK.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            Set-Cookie:
              $ref: '#/components/headers/SetCookieRefresh'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/staff/mfa/recovery-codes:
    post:
      operationId: regenerateRecoveryCodes
      summary: Regenerate MFA backup codes
      tags:
      - Auth
      description: Invalidates the previous codes. Codes are hashed, single use.
      security:
      - bearerJwt: []
      x-fr:
      - FR-15
      x-roles:
      - support_agent
      - finance_officer
      - operations_engineer
      - administrator
      x-step-up:
        max_age_seconds: 300
        problem_code: step_up_required
      x-rate-limit-tier: auth
      x-pool: be_api
      parameters:
      - $ref: '#/components/parameters/RequestId'
      responses:
        '201':
          description: Created.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/RecoveryCodes'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/webauthn/registration-options:
    post:
      operationId: webauthnRegistrationOptions
      summary: WebAuthn registration challenge
      tags:
      - Auth
      security:
      - bearerJwt: []
      x-fr:
      - FR-15
      x-roles:
      - support_agent
      - finance_officer
      - operations_engineer
      - administrator
      x-step-up:
        max_age_seconds: 300
        problem_code: step_up_required
      x-rate-limit-tier: auth
      x-pool: be_api
      parameters:
      - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: OK.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                type: object
