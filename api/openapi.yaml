            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            Set-Cookie:
              $ref: '#/components/headers/SetCookieRefresh'
          content:
            application/json:
              schema:
