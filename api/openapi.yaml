      operationId: verifyWebauthnAssertion
      summary: Verify a WebAuthn assertion and sign in
      tags:
      - Auth
      description: Completes login as the second factor with acr phr.
      security: []
      x-fr:
      - FR-15
      x-roles:
      - public
      x-rate-limit-tier: auth
      x-pool: be_api
