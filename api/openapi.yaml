  /ask-the-data/questions:
    post:
      operationId: askTheData
      summary: Ask a question of the data
      tags:
      - AskTheData
      description: 'Roles: support_agent, finance_officer, operations_engineer, each bound to its own view schema
        (analytics_support, analytics_finance, analytics_ops). The administrator has none (D-14). Budget: model
        3 s, query 5 s (statement_timeout), outer 8 s. SQL must be a single SELECT over the role views, 1,000-row
        cap. Query rows never reach the model; the explanation describes the SQL and assumptions only. Customer
        attributes and phone digits are not exposed. Unsafe SQL: 422 sql_rejected, never run.'
      security:
      - bearerJwt: []
      x-fr:
      - FR-12
      - FR-16
      x-roles:
      - support_agent
      - finance_officer
      - operations_engineer
      x-rate-limit-tier: ask
      x-pool: be_api
      parameters:
      - $ref: '#/components/parameters/IdempotencyKeyOptional'
      - $ref: '#/components/parameters/AcceptLanguage'
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskQuestionCreate'
            example:
              question: How much revenue did each site collect yesterday?
              locale: en
      responses:
        '201':
          description: Created.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            Location:
              $ref: '#/components/headers/Location'
            Idempotency-Key:
              $ref: '#/components/headers/IdempotencyKey'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/AskQuestion'
              example:
                data:
                  id: 0192f3a4-7b1c-7d2e-8a3f-5c6d7e8f0008
                  asked_by: 0192f3a4-7b1c-7d2e-8a3f-5c6d7e8f0032
                  question: How much revenue did each site collect yesterday?
                  locale: en
                  status: completed
                  sql: SELECT s.name, t.currency, SUM(t.amount_minor) AS revenue_minor FROM analytics_finance.v_top_ups
                    t JOIN analytics_common.v_sites s ON s.id = t.site_id WHERE t.status = 'confirmed' AND t.confirmed_day
                    = CURRENT_DATE - 1 GROUP BY s.name, t.currency ORDER BY revenue_minor DESC LIMIT 1000
                  explanation: Sums confirmed top-ups from yesterday per site.
                  role_scope: analytics_finance
                  columns:
                  - name: name
                    type: text
                  - name: currency
                    type: text
                  - name: revenue_minor
                    type: bigint
                  rows:
                  - - Kasenga
                    - USD
                    - 184200
                  - - Lubumbashi North
                    - USD
                    - 96550
                  row_count: 2
                  truncated: false
                  duration_ms: 3120
                  model: claude-opus-5-5
                  created_at: '2026-10-24T08:15:30Z'
        '202':
          description: Not finished inside the 8 s outer budget; poll the Location URL.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/AskQuestion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
