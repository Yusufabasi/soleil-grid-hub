            draft_co_approval have no schema action yet (the schema CHECK must gain them before they can be stored);
            draft_money_affecting is the finance approval of a money-affecting AI draft.'
        status:
          type: string
          enum:
          - pending
          - approved
          - rejected
          - cancelled
          - expired
          - executed
          - failed
