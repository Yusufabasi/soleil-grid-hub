  /dashboard/stream:
    get:
      operationId: streamDashboard
      summary: Live dashboard event stream (SSE)
      tags:
      - Dashboard
      description: '`text/event-stream`. Authenticated ONLY by the single-use `ticket` query parameter (browsers
        cannot set headers on EventSource); the balancer log format strips it. A stream lives at most 10 minutes,
        then the server sends `resync_required` (reason max_age) and closes; the client requests a new ticket and
        reconnects. Role and token version are re-checked on every heartbeat (a revoked or changed principal gets
        `resync_required` reason role_changed and is closed). Events: `snapshot`, `site.status_changed`, `revenue.updated`
        (withheld from roles without revenue access), `alert.raised`, `alert.updated`, `heartbeat` (every 20 s),
        `resync_required`. Reconnect with Last-Event-ID replays from a 5 minute buffer, else `resync_required`.
        Limit 3 concurrent streams per user.'
      security:
      - streamTicket: []
      x-fr:
      - FR-13
      x-nfr:
      - NFR-02
      x-roles:
      - support_agent
      - finance_officer
      - operations_engineer
      x-rate-limit-tier: stream
      x-pool: be_stream
      parameters:
      - $ref: '#/components/parameters/StreamTicketQuery'
      - name: site_id
        in: query
        description: Filter by site id.
        schema:
          type: string
          format: uuid
      - name: last_event_id
        in: query
        description: 'Optional replay cursor for clients that cannot send the Last-Event-ID header: events after
          this id are replayed from the 5 minute buffer, otherwise resync_required. The header takes precedence
          if both are sent.'
        schema:
          type: string
      - $ref: '#/components/parameters/LastEventId'
      - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Event stream.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              description: no-cache, no-transform
              schema:
                type: string
            X-Accel-Buffering:
              description: 'no'
              schema:
                type: string
          content:
            text/event-stream:
              schema:
                type: string
                description: UTF-8 SSE frames separated by blank lines.
              examples:
                frames:
                  value: |+
                    id: 1729758930-1
                    event: snapshot
                    data: {"generated_at":"2026-10-24T08:15:30Z","cache_age_seconds":2,"sites":[],"alerts":{"critical":0,"warning":1,"info":0}}

                    id: 1729758950-2
                    event: heartbeat
                    data: {"server_time":"2026-10-24T08:15:50Z"}

                    id: 1729759530-3
                    event: resync_required
                    data: {"reason":"max_age"}

        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-sse-events:
        snapshot:
          data: '#/components/schemas/DashboardSummary'
          description: Full state; first event and after resync.
        site.status_changed:
          data: '#/components/schemas/SseSiteStatusChanged'
          description: Computed site health or online-meter count changed.
        revenue.updated:
          data: '#/components/schemas/SseRevenueUpdated'
          description: Coalesced to at most one per second.
        alert.raised:
          data: '#/components/schemas/Alert'
          description: A new alert opened.
        alert.updated:
          data: '#/components/schemas/Alert'
          description: Acknowledged or resolved.
        heartbeat:
          data: '#/components/schemas/SseHeartbeat'
          description: Every 20 s; role and token version re-checked.
        resync_required:
          data: '#/components/schemas/SseResyncRequired'
          description: Drop state; request a new ticket if reason is max_age.
      x-stream-max-seconds: 600
