components:
  securitySchemes:
    bearerJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'EdDSA access token, 10 minutes. Claims: sub, typ, roles, scp, site_ids, locale, tv (token version,
        checked for revocation), acr, amr, auth_time, iat, exp, jti. Staff tokens exist only after MFA. Operations
        marked x-step-up need auth_time within 5 minutes (else 401 step_up_required).'
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: 'Key `sgh_<env>_<keyid>_<secret>`, stored as an HMAC with a server pepper, expiry at most 180
        days. Kinds gateway and integrator carry disjoint scopes (one list: integrator customers:read, meters:read,
        topups:read, topups:write, tickets:read, tickets:write, tickets:inbound; gateway telemetry:write, tokens:acknowledge,
        gateway:heartbeat). Gateway keys are bound to sites and a mandatory CIDR range. The array after the scheme
        lists required scopes.'
    webhookHmac:
      type: apiKey
      in: header
      name: X-Webhook-Signature
      description: Provider webhook signature. Headers X-Webhook-Id (provider event id, equals body.event_id), X-Webhook-Timestamp
        (unix seconds), X-Webhook-Signature = `v1=` + hex(HMAC-SHA256(provider_secret, timestamp + "." + event_id
        + "." + raw_body)). Timestamp within 300 s. Dual-secret overlap of 24 hours during rotation.
    streamTicket:
      type: apiKey
      in: query
      name: ticket
      description: Single-use 30-second ticket bound to the caller IP (POST /dashboard/stream-tickets).
    refreshCookie:
      type: apiKey
      in: cookie
      name: sg_refresh
      description: 'Used ONLY by POST /auth/refresh and POST /auth/logout, which also require X-Hub-CSRF: 1 and
        a same-origin Origin (D-46). Every other operation authenticates with the Authorization header alone. Opaque
        rotating refresh token in an HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth cookie. Browsers only;
        non-browser clients use the body transport.'
  parameters:
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from meta.next_cursor of the previous page.
      schema:
        type: string
        maxLength: 512
    Limit:
      name: limit
      in: query
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    CreatedAfter:
      name: created_after
      in: query
      description: Only items created at or after this UTC instant.
      schema:
        type: string
        format: date-time
    CreatedBefore:
      name: created_before
      in: query
      description: Only items created before this UTC instant.
      schema:
        type: string
        format: date-time
    AcceptLanguage:
      name: Accept-Language
      in: header
      description: 'Preferred language for messages and AI output: en or fr (FR-16). Falls back to the principal
        locale, then en.'
      schema:
        type: string
        examples:
        - fr
        - en
    RequestId:
      name: X-Request-Id
      in: header
      description: Optional client-supplied correlation id, echoed in the response; the server generates one if
        absent or invalid.
      schema:
        type: string
        maxLength: 64
        pattern: ^[A-Za-z0-9_.-]+$
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: 'REQUIRED. Client-generated unique key (a UUID is recommended). The first request with a key
        is processed; repeats with an identical body return the stored response with Idempotent-Replayed: true.
        A different body with the same key gets 422 idempotency_key_reuse; a repeat while the first is still running
        gets 409 idempotency_in_progress. Keys live 24 hours (7 days for top-ups).'
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: ^[A-Za-z0-9_.:-]+$
      required: true
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      description: Optional idempotency key with the semantics described on the required variant.
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: ^[A-Za-z0-9_.:-]+$
    IfMatch:
      name: If-Match
      in: header
      description: REQUIRED on every update of a versioned resource (customers, meters, tickets, drafts, KB articles).
        ETag from the last GET; a stale value gives 412 precondition_failed, a missing one 428 precondition_required.
      schema:
        type: string
      required: true
    WebhookId:
      name: X-Webhook-Id
      in: header
      description: Provider event id; must equal body.event_id. Part of the signed material.
      schema:
        type: string
        maxLength: 128
      required: true
    WebhookTimestamp:
      name: X-Webhook-Timestamp
      in: header
      description: Unix seconds when the provider signed the request. Must be within 300 seconds of server time
        (replay window).
      schema:
        type: integer
        format: int64
      required: true
    WebhookSignature:
      name: X-Webhook-Signature
      in: header
      description: v1=hex(HMAC-SHA256(secret, X-Webhook-Timestamp + "." + X-Webhook-Id + "." + raw_body)). Compare
        in constant time over the raw bytes.
      schema:
        type: string
        pattern: ^v1=[0-9a-f]{64}$
      required: true
    LastEventId:
      name: Last-Event-ID
      in: header
      description: 'SSE reconnect cursor: id of the last event received. Sent automatically by EventSource.'
      schema:
        type: string
    StreamTicketQuery:
      name: ticket
      in: query
      description: Single-use ticket (30 s, bound to the caller IP) from POST /dashboard/stream-tickets.
      schema:
        type: string
    Q:
      name: q
      in: query
      description: Free-text search (prefix and trigram match on name, number, serial or phone as applicable).
      schema:
        type: string
        minLength: 2
        maxLength: 100
    HubCsrf:
      name: X-Hub-CSRF
      in: header
      description: 'REQUIRED, value 1. CSRF guard (D-46) on the only two cookie-authenticated operations (POST /auth/refresh
        and POST /auth/logout): a non-simple header a cross-site form or simple request cannot send. The Origin
        header must also equal the site origin. Failure: 403 csrf_check_failed.'
      schema:
        type: string
        enum:
        - '1'
      required: true
    TokenTransport:
      name: X-Token-Transport
      in: header
      description: Non-browser clients send body to receive the refresh token in the response body. Browsers omit
        it and receive an HttpOnly cookie.
      schema:
        type: string
        enum:
        - cookie
        - body
    CustomerId:
      name: customer_id
      in: path
      description: Customer id (UUIDv7).
      schema:
        type: string
        format: uuid
      required: true
    SiteId:
      name: site_id
