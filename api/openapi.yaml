  /webhooks/providers/{provider}:
    post:
      operationId: receiveProviderWebhook
      summary: Provider payment webhook
      tags:
      - Webhooks
      description: 'Signed string: `{X-Webhook-Timestamp}.{event_id}.{raw body}`, HMAC-SHA256 with the provider
        secret, header `X-Webhook-Signature: v1=<hex>`, verified over the raw bytes in constant time. `X-Webhook-Id`
        must equal body.event_id. Timestamp outside 300 s: 400 stale_timestamp. Bad signature: 401 invalid_signature
        (not stored in provider_events; quarantine log only). DEDUPLICATION is by the provider event id in the body,
        unique on (provider, event_id) and (provider, provider_txn_id) in PostgreSQL, NOT by Idempotency-Key (providers
        do not send one). Processing is synchronous: in one transaction the event is recorded, posted to the ledger
        and written to the outbox, then acknowledged (p95 under 300 ms). The payer phone is checked against the
        pending top-up; confirmations of 100 USD or more (threshold [open]) are confirmed by a status pull. payment.confirmed
        credits once, including after expiry or cancellation (late); payment.failed is recorded; payment.reversed
        posts a reversing entry and, if the energy was already issued, the shortfall to chargeback_receivable with
        an exception (D-06). Unknown references are acknowledged and parked for reconciliation. 5xx means nothing
        was committed, so provider retries are safe.'
      security:
      - webhookHmac: []
      x-fr:
      - FR-03
      - FR-02
      x-nfr:
      - NFR-01
      - NFR-02
      - NFR-05
      x-roles:
      - provider
      x-rate-limit-tier: webhook
      x-pool: be_webhooks
      parameters:
      - $ref: '#/components/parameters/Provider'
      - $ref: '#/components/parameters/WebhookId'
      - $ref: '#/components/parameters/WebhookTimestamp'
      - $ref: '#/components/parameters/WebhookSignature'
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookEnvelope'
            example:
              event_id: evt_9f31c2
              type: payment.confirmed
              occurred_at: '2026-10-24T08:15:30Z'
              data:
                provider_reference: MP241024.0815.A77
                external_reference: 0192f3a4-7b1c-7d2e-8a3f-5c6d7e8f0003
                amount:
                  amount_minor: 500
                  currency: USD
                payer_msisdn: '+243810000111'
      responses:
        '200':
          description: OK.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/WebhookAck'
              examples:
                accepted:
                  summary: First delivery
                  value:
                    data:
                      status: accepted
                      event_id: evt_9f31c2
                duplicate:
                  summary: Provider retry of an already-processed event
                  value:
                    data:
                      status: duplicate
                      event_id: evt_9f31c2
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
