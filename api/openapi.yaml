          description: 'Maps to approvals.action in db/schema.sql (schema names win): reconciliation_resolution=recon.resolve,
            manual_adjustment=ledger.adjustment, refund=ledger.refund, tariff_change=tariff.change, role_grant=role.grant,
            user_creation=user.create, mfa_reset=mfa.reset, api_key_creation=apikey.create, erasure=erasure.approve,
