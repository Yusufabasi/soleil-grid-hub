  /auth/step-up:
    post:
      operationId: stepUp
      summary: Step-up re-authentication
      tags:
      - Auth
      description: 'Operations marked x-step-up need auth_time within 5 minutes and acr of at least mfa; otherwise
        401 step_up_required with a WWW-Authenticate challenge. Guarded: approvals, role grants, key creation, export
        and erasure.'
      security:
      - bearerJwt: []
      x-fr:
      - FR-15
      x-roles:
      - support_agent
      - finance_officer
      - operations_engineer
      - administrator
      x-rate-limit-tier: auth
      x-pool: be_api
