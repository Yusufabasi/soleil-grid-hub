# api/permissions.yaml: single source of the roles allowed per operation (D-14).
# x-roles in api/openapi.yaml is generated from this file; tests/test_alignment.py fails when they differ.
# Roles: support_agent, finance_officer, operations_engineer, administrator, customer (people);
# integrator, gateway (API-key kinds), provider (HMAC webhook sender), public (no credential).
# D-14: administrator serves no money, ticket, customer-content or ask-the-data operation.
approval_kinds:  # who may propose and who may decide each approval kind (support_agent decides kb_publish only)
  api_key_creation: {approvers: [administrator]}
  data_export: {approvers: [administrator]}
  draft_co_approval: {approvers: [finance_officer]}
  draft_money_affecting: {approvers: [finance_officer]}
  erasure: {approvers: [administrator]}
  kb_publish: {approvers: [support_agent, administrator]}
  manual_adjustment: {approvers: [finance_officer]}
  mfa_reset: {approvers: [administrator]}
  period_lock: {approvers: [finance_officer]}
  period_reopen: {approvers: [finance_officer]}
  reconciliation_resolution: {approvers: [finance_officer]}
  refund: {approvers: [finance_officer]}
  role_grant: {approvers: [administrator]}
  tariff_change: {approvers: [finance_officer]}
  user_creation: {approvers: [administrator]}
